; Canonical dist.ini skeleton. See ~/projects/Agents/DZIL_GUIDE.md.
; Replace Dist-Name / lib/Main/Module.pm / the GitHub org, then delete the
; blocks marked OPTIONAL that this distribution does not need.

name             = Dist-Name
author           = Chad Granum <exodist7@gmail.com>
license          = Perl_5
copyright_holder = Chad Granum

[RewriteVersion]   ; sets dist version from the main module's $VERSION
[License]
[ManifestSkip]
[Manifest]
[NextRelease]

[GatherDir]
exclude_match    = ^old                ; [only if the project keeps a reference tree]
exclude_match    = ^reference          ; [only if the project keeps a reference tree]
exclude_match    = ^worktrees
exclude_match    = ^agent_scripts/
exclude_match    = ^AI_DOCS/
exclude_match    = ^release-scripts
exclude_match    = ^demo
exclude_match    = ^cover              ; cover_db and friends
exclude_match    = ^nyt
exclude_match    = ^test-logs
exclude_match    = ^data/
exclude_match    = ^pt                 ; only run these tests locally
exclude_match    = ^tt                 ; only run these tests locally
exclude_match    = ^xt/downstream      ; only run these tests locally
exclude_match    = ^t/                 ; re-gathered below, to pick up dotfiles
exclude_match    = \.md$               ; internal docs never ship
exclude_filename = LICENSE
exclude_filename = Makefile.PL
exclude_filename = README
exclude_filename = README.md
exclude_filename = cpanfile
exclude_filename = cpanfile.ci
exclude_filename = TEMPLATE.pod
exclude_filename = .yath-persist.json

[PruneCruft]

; Re-gather t/ through Git so t/ dotfiles ship. One block per test root.
[Git::GatherDir / GatherDotFilesT]
root             = t/
prefix           = t/
include_dotfiles = 1

; OPTIONAL -- only if the dist ships executables in scripts/
;[ExecDir]
;dir = scripts

; OPTIONAL -- only if the dist ships share/
;[ShareDir]
;dir = share

; OPTIONAL -- only if POD is generated at build time
;[Run::AfterBuild]
;run = release-scripts/generate_command_pod.pl %d

[PodSyntaxTests]
[TestRelease]

[MetaResources]
bugtracker.web  = https://github.com/exodist/Dist-Name/issues
repository.url  = https://github.com/exodist/Dist-Name/
repository.type = git

[Prereqs]
; Hard runtime requirements only -- modules loaded unconditionally.
perl             = 5.012000
Carp             = 0
Object::HashBase = 0.016
Role::Tiny       = 2.000003
Scalar::Util     = 1.56
parent           = 0

[Prereqs / TestRequires]
Test2::V0 = 0.000060

[Prereqs / ConfigureRequires]
ExtUtils::MakeMaker = 0

[Prereqs / DevelopRequires]
; Author tooling plus every optional driver, so a dev box installs the full
; matrix and the author suite actually exercises it.

[Prereqs / RuntimeSuggests]
; Optional and lazily required at the point of use. Nothing breaks without
; them; a feature is simply absent. Non-default DB drivers live here.

[Prereqs / RuntimeRecommends]
; Optional, but wanted when available (an XS accelerator, a faster JSON
; backend). The pure-Perl path stays complete.

[MakeMaker::Awesome]
:version  = 0.26
delimiter = |
header    = |use Config qw/%Config/;
header    = |if ($ENV{AUTOMATED_TESTING}) {
header    = |    my $is_njh = 0;
header    = |    $is_njh ||= -d '/export/home/njh';
header    = |    $is_njh ||= -d '/home/njh';
header    = |    $is_njh ||= lc($ENV{USER} // 'na') eq 'njh';
header    = |    $is_njh ||= lc($ENV{HOME} // 'na') =~ m{njh$};
header    = |    $is_njh ||= lc($ENV{PATH} // 'na') =~ m{/njh/};
header    = |    die "OS unsupported\nNJH smokers are broken, aborting tests.\n"
header    = |        if $is_njh;
header    = |}

[CPANFile]
[MetaYAML]
[MetaJSON]

; authordep Pod::Markdown
[ReadmeFromPod / Markdown]
filename = lib/Main/Module.pm
type     = markdown
readme   = README.md

[ReadmeFromPod / Text]
filename = lib/Main/Module.pm
type     = text
readme   = README

[CopyFilesFromBuild]
copy = LICENSE
copy = cpanfile
copy = README
copy = README.md
copy = Makefile.PL

[Git::Check]
allow_dirty = Makefile.PL
allow_dirty = README
allow_dirty = README.md
allow_dirty = cpanfile
allow_dirty = LICENSE
allow_dirty = Changes

[Git::Commit]
allow_dirty = Makefile.PL
allow_dirty = README
allow_dirty = README.md
allow_dirty = cpanfile
allow_dirty = LICENSE
allow_dirty = Changes

[Git::Tag]

; Releases are manual: build, test, tag, bump -- but never upload.
[FakeRelease]

[BumpVersionAfterRelease]

[Git::Commit / Commit_Changes]
munge_makefile_pl = true
allow_dirty_match = ^lib
allow_dirty_match = ^scripts
allow_dirty       = Makefile.PL
allow_dirty       = README
allow_dirty       = README.md
allow_dirty       = cpanfile
allow_dirty       = LICENSE
commit_msg        = Automated Version Bump
